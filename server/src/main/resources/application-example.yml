# ===========================================================================
# 可提交的配置示例：所有敏感项都走环境变量占位符，不含任何真实密钥。
# 复制为 application.yml（本地覆盖用 application-local.yml 并激活 local profile）后使用。
# ===========================================================================
server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 100        # 2 核机器不需要 200 个线程
      min-spare: 10
    accept-count: 50

spring:
  application:
    name: couple-nest-server

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:couple_nest}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}   # 环境变量注入，不提供默认值
    hikari:
      pool-name: CoupleNestPool
      maximum-pool-size: 10        # 单机 2C2G，MySQL 默认 max_connections=151
      minimum-idle: 5
      connection-timeout: 3000     # 拿不到连接快速失败，不让请求堆积
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:5}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 微信小程序：填入你自己的小程序 AppID 和 Secret（走环境变量注入）
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  mock: ${WECHAT_MOCK:false}   # 本地开发用 local profile 覆盖为 true

# JWT 密钥：必须由环境变量 JWT_SECRET 注入，缺失时启动直接失败
jwt:
  secret: ${JWT_SECRET}
  expire-days: ${JWT_EXPIRE_DAYS:7}

# 阿里云 OSS：AK/SK 必须由环境变量注入，禁止写死真实密钥
oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
  # 允许为空：图片上传是可选能力，缺失时应用照常启动、上传接口返回明确提示
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:java-ai-xiaoliyu}
