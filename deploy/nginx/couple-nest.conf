# ===========================================================================
# 情侣小窝 —— Nginx 反向代理配置（放到 /etc/nginx/conf.d/couple-nest.conf）
# 作用：HTTPS 终止 + 转发到本机 8080 的 Spring Boot 服务 + 传递真实客户端 IP
# 关键点：X-Forwarded-For 用 $remote_addr「覆盖」而不是 $proxy_add_x_forwarded_for「追加」，
#         否则客户端可以自己伪造 XFF 头，绕过登录限流、甚至在日志里嫁祸他人 IP。
#         如果以后前面再挂 CDN/WAF，必须改成只信任固定跳数，不能盲目取第一个 IP。
# ===========================================================================

# 80 端口只用来跳转和给 certbot 做域名校验
server {
    listen 80;
    server_name api.example.com;          # TODO 换成你自己的备案域名

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;          # TODO 换成你自己的备案域名

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 图片上传：业务上限 5MB，留出 multipart 封装余量
    client_max_body_size 10m;
    access_log /var/log/nginx/couple-nest.access.log;
    error_log  /var/log/nginx/couple-nest.error.log warn;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;   # 覆盖，防伪造
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
    }
}
